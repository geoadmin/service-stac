services:
  db:
    image: kartoza/postgis:18-3.6
    environment:
      - POSTGRES_DB=${DB_NAME:-service_stac_local}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis
      - EXTRA_CONF=log_min_messages = ${DB_LOG_LEVEL:-FATAL}
    user: ${UID}
    ports:
      - ${DB_PORT:-15432}:5432
    volumes:
      - type: bind
        source: ${PWD}/.volumes/postgresql
        target: /var/lib/postgresql

  moto-server:
    image: motoserver/moto
    container_name: moto-server
    ports:
      - "${S3_PORT:-9000}:${MOTO_PORT:-5000}"
    environment:
      - MOTO_PORT=${MOTO_PORT:-5000}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MOTO_PORT:-5000}/moto-api/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot service that creates the S3 buckets on moto-server. It runs on every
  # `docker compose up` since moto-server has no persistence and starts empty.
  moto-init:
    image: amazon/aws-cli
    container_name: moto-init
    depends_on:
      moto-server:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${LEGACY_AWS_ACCESS_KEY_ID:-motoadmin}
      - AWS_SECRET_ACCESS_KEY=${LEGACY_AWS_SECRET_ACCESS_KEY:-motoadmin}
      - AWS_DEFAULT_REGION=${AWS_S3_REGION_NAME:-eu-central-1}
    entrypoint: >
      /bin/sh -c "
        for bucket in ${LEGACY_AWS_S3_BUCKET_NAME:-service-stac-local} ${AWS_S3_BUCKET_NAME:-service-stac-local-managed};
        do
          aws --endpoint-url=http://moto-server:${MOTO_PORT:-5000} s3 mb s3://\$$bucket || true;
        done;
        exit 0;
      "
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: --config otel-local-config.yaml
    volumes:
      - ./otel-local-config.yaml:/otel-local-config.yaml
    ports:
      - "4317:4317"

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
